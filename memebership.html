<!DOCTYPE html>
<html>
<head>
    <title>Membership Registration</title>
</head>
<body>

<header>
    <h1>Membership Registration</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="programs.html">Programs</a> |
        <a href="membership.html">Membership</a> |
        <a href="trainers.html">Trainers</a> |
        <a href="contact.html">Contact</a>
    </nav>
</header>

<hr>

<form>

    <label>Full Name:</label><br>
    <input type="text" required><br><br>

    <label>Email:</label><br>
    <input type="email" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel"><br><br>

    <label>Age:</label><br>
    <input type="number"><br><br>

    <label>Gender:</label><br>

    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <label>Membership Type:</label><br>

    <select>
        <option>Monthly</option>
        <option>Quarterly</option>
        <option>Annual</option>
    </select>

    <br><br>

    <label>Select Programs:</label><br>

    <input type="checkbox"> Weight Training<br>
    <input type="checkbox"> Yoga<br>
    <input type="checkbox"> Zumba<br>
    <input type="checkbox"> Cardio Fitness<br><br>

    <label>Fitness Goals:</label><br>

    <textarea rows="5" cols="40"></textarea>

    <br><br>

    <input type="submit" value="Register">

</form>

<footer>
    <hr>
    <p>&copy; 2026 FitLife Fitness Club</p>
</footer>

</body>
</html>
